name: Android CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release and tag from this commit"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag (example: v0.1.0)"
        required: false
        type: string
        default: "v0.1.0"
      apk_url:
        description: "Optional public GitHub release URL for edge-69.apk to run static DEX/ELF analysis"
        required: false
        type: string
        default: ""
      build_reference_core:
        description: "Also build the pinned public Skyline reference source (long native build)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Keep every push/tag/dispatch run; only superseded runs for the same PR share a group.
  group: skyline-android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify Android packages
    # The integration PR has its own full native-core build workflow; avoid a duplicate scaffold build.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'integration/skyline-native-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/cmdline-tools"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              --output android-command-line-tools.zip
            mkdir -p "$RUNNER_TEMP/android-cli-unpack" "$SDK/cmdline-tools/latest"
            unzip -q android-command-line-tools.zip -d "$RUNNER_TEMP/android-cli-unpack"
            cp -a "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure release signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing secrets not configured; release outputs will be unsigned."
            exit 0
          fi
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/skyline-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Analyze reference APK (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_url != '' }}
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          case "$APK_URL" in
            https://github.com/*|https://objects.githubusercontent.com/*|https://release-assets.githubusercontent.com/*) ;;
            *) echo "APK URL must be a GitHub release asset URL."; exit 1 ;;
          esac
          mkdir -p dist/reverse-engineering
          curl --fail --location --retry 3 --retry-all-errors "$APK_URL" --output "$RUNNER_TEMP/edge-69.apk"
          python3 tools/edge69_apk_audit.py "$RUNNER_TEMP/edge-69.apk" --output dist/reverse-engineering/edge69-audit.json
          test -s dist/reverse-engineering/edge69-audit.json

          # JADX recovers reviewable Java-like source from DEX; it does not restore original Kotlin/C++.
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            --output "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code \
            -d dist/reverse-engineering/jadx-source "$RUNNER_TEMP/edge-69.apk"
          test -d dist/reverse-engineering/jadx-source/sources
          (cd dist/reverse-engineering && zip -qr jadx-source.zip jadx-source)

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$SDKMANAGER" --version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Run unit tests and build all variants
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - name: Verify APK and AAB outputs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          mkdir -p dist
          cp "$DEBUG_APK" dist/SkylineDimm-debug.apk
          cp "$RELEASE_APK" dist/SkylineDimm-release.apk
          cp "$RELEASE_AAB" dist/SkylineDimm-release.aab

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" >/dev/null
          unzip -t "$RELEASE_AAB" >/dev/null

          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/SkylineDimm-release.apk
            printf '%s\\n' "Release APK/AAB signed with configured repository secrets." > dist/SIGNING_STATUS.txt
          else
            printf '%s\\n' "Release APK/AAB are unsigned. Install the signed debug APK for local testing, or configure the four signing secrets." > dist/SIGNING_STATUS.txt
          fi

          (
            cd dist
            sha256sum SkylineDimm-debug.apk SkylineDimm-release.apk SkylineDimm-release.aab SIGNING_STATUS.txt > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkylineDimm-Android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release_meta
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
        shell: bash
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$RELEASE_TAG_INPUT"
          else
            TAG_NAME="${RELEASE_COMMIT_MESSAGE#release: }"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Skyline Dimm ${{ steps.release_meta.outputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist/SkylineDimm-debug.apk
            dist/SkylineDimm-release.apk
            dist/SkylineDimm-release.aab
            dist/SIGNING_STATUS.txt
            dist/SHA256SUMS.txt

  reference-core-build:
    name: Build pinned Skyline reference core (optional)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_reference_core) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'build-reference-core:')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout pinned Skyline source and all submodules
        uses: actions/checkout@v4
        with:
          repository: im030/skyline-emu
          ref: 35fb874a42cb548cbd3d66a00d65e4b2a4c1516b
          submodules: false
          fetch-depth: 1
          path: reference/skyline

      # The historical upstream URLs for these two dependencies were removed.
      # Use maintained public mirrors while preserving the exact gitlink commits.
      - name: Restore unavailable historical submodule mirrors
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          git config -f .gitmodules submodule.Sirit.url https://github.com/yuzu-mirror/sirit
          git config -f .gitmodules 'submodule.Shader Compiler.url' https://github.com/strato-emu/shader-compiler
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install reference toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.0.8775105" \
            "cmake;3.22.1"

      - name: Build optimized Skyline reference release APK
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Release compiles the native core with CMAKE_BUILD_TYPE=RELEASE and
          # excludes the large Vulkan validation-layer libraries used by Debug.
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleFullRelease
          APK="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/reference-dist"
          cp "$APK" "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk"

          AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk" > "$GITHUB_WORKSPACE/reference-dist/APK-METADATA.txt"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk"
          unzip -l "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk" | grep -q 'lib/arm64-v8a/libskyline.so'
          if unzip -l "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk" | grep -q 'libVkLayer_khronos_validation.so'; then
            echo "Unexpected Vulkan validation layer in optimized release APK."
            exit 1
          fi
          sha256sum "$GITHUB_WORKSPACE/reference-dist/Skyline-Reference-full-release.apk" \
            > "$GITHUB_WORKSPACE/reference-dist/SHA256SUMS.txt"

      - name: Upload optimized reference emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Reference-Core-Release-APK
          path: reference-dist/
          if-no-files-found: error
          retention-days: 30
