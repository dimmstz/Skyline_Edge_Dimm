name: Android CI and Release

on:
  push:
    branches:
      - main
      - fix/re4-video-decoder
      - feat/advanced-graphics-video-m23
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional public GitHub release URL for edge-69.apk to run static DEX/ELF analysis"
        required: false
        type: string
        default: ""
      build_reference_core:
        description: "Also build the pinned public Skyline reference source (long native build)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialize per branch/PR and cancel stale commits so one branch does not compile duplicate native APKs.
  group: skyline-android-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android packages
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/cmdline-tools"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              --output android-command-line-tools.zip
            mkdir -p "$RUNNER_TEMP/android-cli-unpack" "$SDK/cmdline-tools/latest"
            unzip -q android-command-line-tools.zip -d "$RUNNER_TEMP/android-cli-unpack"
            cp -a "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure release signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing secrets not configured; release outputs will be unsigned."
            exit 0
          fi
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/skyline-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Analyze reference APK (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_url != '' }}
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          case "$APK_URL" in
            https://github.com/*|https://objects.githubusercontent.com/*|https://release-assets.githubusercontent.com/*) ;;
            *) echo "APK URL must be a GitHub release asset URL."; exit 1 ;;
          esac
          mkdir -p dist/reverse-engineering
          curl --fail --location --retry 3 --retry-all-errors "$APK_URL" --output "$RUNNER_TEMP/edge-69.apk"
          python3 tools/edge69_apk_audit.py "$RUNNER_TEMP/edge-69.apk" --output dist/reverse-engineering/edge69-audit.json
          test -s dist/reverse-engineering/edge69-audit.json

          # JADX recovers reviewable Java-like source from DEX; it does not restore original Kotlin/C++.
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            --output "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code \
            -d dist/reverse-engineering/jadx-source "$RUNNER_TEMP/edge-69.apk"
          test -d dist/reverse-engineering/jadx-source/sources
          (cd dist/reverse-engineering && zip -qr jadx-source.zip jadx-source)

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$SDKMANAGER" --version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Run unit tests and build all variants
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - name: Verify APK and AAB outputs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          mkdir -p dist
          cp "$DEBUG_APK" dist/SkylineDimm-debug.apk
          cp "$RELEASE_APK" dist/SkylineDimm-release.apk
          cp "$RELEASE_AAB" dist/SkylineDimm-release.aab

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RELEASE_APK" >/dev/null
          unzip -t "$RELEASE_AAB" >/dev/null

          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/SkylineDimm-release.apk
            printf '%s\\n' "Release APK/AAB signed with configured repository secrets." > dist/SIGNING_STATUS.txt
          else
            printf '%s\\n' "Release APK/AAB are unsigned. Install the signed debug APK for local testing, or configure the four signing secrets." > dist/SIGNING_STATUS.txt
          fi

          (
            cd dist
            sha256sum SkylineDimm-debug.apk SkylineDimm-release.apk SkylineDimm-release.aab SIGNING_STATUS.txt > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkylineDimm-Android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  reference-core-build:
    name: Build Strato graphics/video core for Skyline Dimm
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_reference_core) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/re4-video-decoder' || github.ref == 'refs/heads/feat/advanced-graphics-video-m23')) || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout pinned Strato/Skyline source
        uses: actions/checkout@v4
        with:
          repository: LukeValen/Strato-Mali-Public-Build
          ref: 9249ea351ad7bd7b0e7d4a319e1ad1c56dae865c
          submodules: false
          fetch-depth: 1
          path: reference/strato

      - name: Checkout Dimm integration and graphics patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: project

      - name: Restore all pinned source submodules
        working-directory: reference/strato
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule attempt $attempt failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Install native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavutil-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools ninja-build ccache

      - name: Resolve canonical application version
        id: version
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE), release tag $RELEASE_TAG"

      - name: Apply Dimm graphics controls and VIC/frame-queue fixes
        run: python3 project/tools/apply_advanced_graphics.py reference/strato

      - name: Generate Brazilian Portuguese app localization
        run: python3 project/tools/generate_pt_br_localization.py reference/strato

      - name: Verify Dimm settings reach native Vulkan and VIC code
        run: python3 project/tests/test_dimm_advanced_graphics.py reference/strato

      - name: Test NVDEC and VIC video pipeline
        working-directory: reference/strato
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_video_pipeline.py
          python3 tests/test_video_completion.py

      - name: Test internal Vulkan resolution scaling
        working-directory: reference/strato
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 python3 tests/test_resolution_scaling.py
          python3 tests/test_resolution_vulkan.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-skyline-dimm-strato-${{ hashFiles('reference/strato/**/build.gradle', 'reference/strato/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-skyline-dimm-strato-

      - name: Validate patched Kotlin settings
        working-directory: reference/strato
        run: ./gradlew --no-daemon --stacktrace compileMainlineReleaseKotlin

      - name: Build optimized ARM64 native emulator
        working-directory: reference/strato
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleMainlineRelease
          APK="$(find app/build/outputs/apk/mainline/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/reference-dist"
          cp "$APK" "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk" > "$GITHUB_WORKSPACE/reference-dist/APK-METADATA.txt"
          grep -q "package: name='com.dimm.skyline'" "$GITHUB_WORKSPACE/reference-dist/APK-METADATA.txt"
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" "$GITHUB_WORKSPACE/reference-dist/APK-METADATA.txt"
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" "$GITHUB_WORKSPACE/reference-dist/APK-METADATA.txt"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk"
          unzip -l "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk" | grep -q 'lib/arm64-v8a/libskyline.so'
          (
            cd "$GITHUB_WORKSPACE/reference-dist"
            sha256sum SkylineDimm-M23-ARM64.apk > SHA256SUMS.txt
          )
          printf '%s\n' "Native Strato/Skyline ARM64 build; Vulkan resolution scaling, mipmap LOD bias, anisotropy override and expanded NVDEC/VIC frame handling." > "$GITHUB_WORKSPACE/reference-dist/BUILD-INFO.txt"

      - name: Upload optimized native emulator
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Dimm-Advanced-Graphics-Video-APK
          path: reference-dist/
          if-no-files-found: error
          retention-days: 30

  publish-reference-release:
    name: Publish verified native Skyline Dimm APK
    needs: [build, reference-core-build]
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_reference_core)) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified native APK
        uses: actions/download-artifact@v4
        with:
          name: Skyline-Dimm-Advanced-Graphics-Video-APK
          path: release-assets

      - name: Verify release files and hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/SkylineDimm-M23-ARM64.apk
          test -s release-assets/APK-METADATA.txt
          test -s release-assets/SHA256SUMS.txt
          test -s release-assets/BUILD-INFO.txt
          grep -q "package: name='com.dimm.skyline'" release-assets/APK-METADATA.txt
          grep -q "versionCode='${{ needs.reference-core-build.outputs.version_code }}'" release-assets/APK-METADATA.txt
          grep -q "versionName='${{ needs.reference-core-build.outputs.version_name }}'" release-assets/APK-METADATA.txt
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Publish native emulator release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.reference-core-build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Skyline Dimm ${{ needs.reference-core-build.outputs.version_name }} - Advanced graphics and video
          body: |
            Native ARM64 Android build based on the pinned Strato/Skyline source.

            - Package: com.dimm.skyline
            - Version: ${{ needs.reference-core-build.outputs.version_name }} (versionCode ${{ needs.reference-core-build.outputs.version_code }})
            - ABI: arm64-v8a
            - Internal Vulkan render resolution: 0.50x through 2.00x, native fallback for unsupported passes
            - Texture controls: configurable mipmap LOD bias and device-limited anisotropic filtering
            - Video: exact NVDEC frame-address matching, multiple VIC surfaces, alpha composition, field modes and flipped NV12 output
            - Video codecs enabled in this source: H.264, VP8 and VP9
            - APK signature, package identity, version and native library verified in CI

            Source and licenses:
            - Strato/Skyline base: https://github.com/LukeValen/Strato-Mali-Public-Build/tree/9249ea351ad7bd7b0e7d4a319e1ad1c56dae865c
            - Original Skyline base: https://github.com/im030/skyline-emu/tree/35fb874a42cb548cbd3d66a00d65e4b2a4c1516b
            - Dimm integration: https://github.com/dimmstz/Skyline_Edge_Dimm/tree/${{ github.sha }}
            - The combined source retains its GPL-3.0, MPL-2.0 and FFmpeg LGPL notices.

            Automated NVDEC/VIC and Vulkan resolution tests must pass before publishing. Resident Evil 4 campaign playback and Galaxy M23 visual output still require on-device confirmation.
          files: |
            release-assets/SkylineDimm-M23-ARM64.apk
            release-assets/APK-METADATA.txt
            release-assets/SHA256SUMS.txt
            release-assets/BUILD-INFO.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

# Versioning policy:
# - version.properties is the single source of truth for VERSION_NAME, VERSION_CODE and RELEASE_TAG.
# - Bump all three values together for each intended native release.
# - A successful main build publishes the native APK under RELEASE_TAG; run numbers never become app versions.
# - Tag-triggered runs are skipped to prevent recursive duplicate builds/releases.
