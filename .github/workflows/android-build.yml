name: Android CI and Release

on:
  push:
    branches:
      - main
      - fix/re4-video-decoder
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release and tag from this commit"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Release tag (example: v0.1.0)"
        required: false
        type: string
        default: "v0.1.0"
      apk_url:
        description: "Optional public GitHub release URL for edge-69.apk to run static DEX/ELF analysis"
        required: false
        type: string
        default: ""
      build_reference_core:
        description: "Also build the pinned public Skyline reference source (long native build)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Keep every push/tag/dispatch run; only superseded runs for the same PR share a group.
  group: skyline-android-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify Android packages
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate or install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/cmdline-tools"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            cd "$RUNNER_TEMP"
            curl --fail --location --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              --output android-command-line-tools.zip
            mkdir -p "$RUNNER_TEMP/android-cli-unpack" "$SDK/cmdline-tools/latest"
            unzip -q android-command-line-tools.zip -d "$RUNNER_TEMP/android-cli-unpack"
            cp -a "$RUNNER_TEMP/android-cli-unpack/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Configure release signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing secrets not configured; release outputs will be unsigned."
            exit 0
          fi
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/skyline-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Analyze reference APK (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apk_url != '' }}
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          case "$APK_URL" in
            https://github.com/*|https://objects.githubusercontent.com/*|https://release-assets.githubusercontent.com/*) ;;
            *) echo "APK URL must be a GitHub release asset URL."; exit 1 ;;
          esac
          mkdir -p dist/reverse-engineering
          curl --fail --location --retry 3 --retry-all-errors "$APK_URL" --output "$RUNNER_TEMP/edge-69.apk"
          python3 tools/edge69_apk_audit.py "$RUNNER_TEMP/edge-69.apk" --output dist/reverse-engineering/edge69-audit.json
          test -s dist/reverse-engineering/edge69-audit.json

          # JADX recovers reviewable Java-like source from DEX; it does not restore original Kotlin/C++.
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip \
            --output "$RUNNER_TEMP/jadx.zip"
          mkdir -p "$RUNNER_TEMP/jadx"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" --no-res --show-bad-code \
            -d dist/reverse-engineering/jadx-source "$RUNNER_TEMP/edge-69.apk"
          test -d dist/reverse-engineering/jadx-source/sources
          (cd dist/reverse-engineering && zip -qr jadx-source.zip jadx-source)

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$SDKMANAGER" --version
          gradle --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Compile diagnostic UI and run unit tests (no distributable package)
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleRelease


  reference-core-build:
    name: Build pinned Skyline reference core (optional)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_reference_core) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/re4-video-decoder')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout pinned Skyline source and all submodules
        uses: actions/checkout@v4
        with:
          repository: im030/skyline-emu
          ref: 35fb874a42cb548cbd3d66a00d65e4b2a4c1516b
          submodules: false
          fetch-depth: 1
          path: reference/skyline

      - name: Checkout Dimm video integration overlay
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: project

      # Apply the pinned GPL-3.0-or-later NVDEC/VIC implementation to the
      # original Skyline checkout. The backup branch and upstream source stay untouched.
      - name: Integrate H.264 VP8 VP9 video decoder and VIC compositor
        run: python3 project/tools/apply_video_decoder.py reference/skyline

      # The historical upstream URLs for these two dependencies were removed.
      # Use maintained public mirrors while preserving the exact gitlink commits.
      - name: Restore unavailable historical submodule mirrors
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          git config -f .gitmodules submodule.Sirit.url https://github.com/yuzu-mirror/sirit
          git config -f .gitmodules 'submodule.Shader Compiler.url' https://github.com/strato-emu/shader-compiler
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Run NVDEC/VIC regression tests (H.264, VP8, VIC surfaces and fences)
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libavcodec-dev libavutil-dev
          python3 tests/test_video_pipeline.py
          python3 tests/test_video_completion.py

      # Native reference build fix: resolve the pinned Hilt plugin from Google's Maven.
      # The pinned upstream settings.gradle only includes :app. Its root
      # build.gradle declares Hilt through the plugins DSL, so Gradle needs
      # Google's Maven repository in pluginManagement (not only dependencies).
      - name: Configure Gradle plugin repositories for pinned Skyline
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle")
          original = settings.read_text(encoding="utf-8")
          if "pluginManagement" not in original:
              block = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """
              settings.write_text(block + original, encoding="utf-8")
          elif "google()" not in original.split("pluginManagement", 1)[1].split("}", 1)[0]:
              raise SystemExit("pluginManagement exists but does not declare google(); refusing unsafe rewrite")
          PY
          grep -A6 '^pluginManagement' settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install reference toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.0.8775105" \
            "cmake;3.22.1"

      # Keep the upstream Kotlin/JNI namespace unchanged: libskyline.so exports
      # Java_emu_skyline_* symbols. Only change the installable application ID
      # and user-facing label so this fork can coexist with the original Skyline.
      - name: Apply Skyline Dimm application identity
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text(encoding="utf-8")
          replacements = {
              'applicationId "skyline.emu"': 'applicationId "com.dimm.skyline"',
              'versionCode 3': 'versionCode 71',
              'versionName "0.0.3"': 'versionName "0.1.57-video"',
              'manifestPlaceholders += [appLabel: "Skyline"]': 'manifestPlaceholders += [appLabel: "Skyline Dimm"]',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}")
              source = source.replace(old, new, 1)
          if 'namespace \'emu.skyline\'' not in source:
              raise SystemExit("JNI namespace emu.skyline changed or missing; refusing unsafe package migration")
          path.write_text(source, encoding="utf-8")
          PY
          grep -E 'namespace |applicationId |versionCode |versionName |appLabel' app/build.gradle

      - name: Build optimized Skyline reference release APK
        working-directory: reference/skyline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Release compiles the native core with CMAKE_BUILD_TYPE=RELEASE and
          # excludes the large Vulkan validation-layer libraries used by Debug.
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleFullRelease :app:bundleFullRelease
          APK="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/fullRelease -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          test -n "$AAB"
          test -s "$AAB"
          mkdir -p "$GITHUB_WORKSPACE/reference-dist"
          cp "$APK" "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk"
          cp "$AAB" "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.aab"

          AAPT="$ANDROID_HOME/build-tools/33.0.2/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          "$AAPT" dump badging "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk" > "$RUNNER_TEMP/native-apk-metadata.txt"
          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk"
          jarsigner -verify "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.aab"
          unzip -l "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk" | grep -q 'lib/arm64-v8a/libskyline.so'
          unzip -l "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.aab" | grep -q 'base/lib/arm64-v8a/libskyline.so'
          if unzip -l "$GITHUB_WORKSPACE/reference-dist/SkylineDimm-M23-ARM64.apk" | grep -q 'libVkLayer_khronos_validation.so'; then
            echo "Unexpected Vulkan validation layer in optimized release APK."
            exit 1
          fi
          grep -q "package: name='com.dimm.skyline'" "$RUNNER_TEMP/native-apk-metadata.txt"
          grep -q "versionName='0.1.57-video'" "$RUNNER_TEMP/native-apk-metadata.txt"

      - name: Upload final native APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SkylineDimm-M23-Final-${{ github.run_number }}
          path: |
            reference-dist/SkylineDimm-M23-ARM64.apk
            reference-dist/SkylineDimm-M23-ARM64.aab
          if-no-files-found: error
          retention-days: 30

  publish-reference-release:
    name: Publish final native APK and AAB release
    needs: [build, reference-core-build]
    if: ${{ success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_reference_core)) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified native APK and AAB
        uses: actions/download-artifact@v4
        with:
          name: SkylineDimm-M23-Final-${{ github.run_number }}
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/SkylineDimm-M23-ARM64.apk
          test -s release-assets/SkylineDimm-M23-ARM64.aab
          unzip -t release-assets/SkylineDimm-M23-ARM64.apk >/dev/null
          unzip -t release-assets/SkylineDimm-M23-ARM64.aab >/dev/null
          unzip -l release-assets/SkylineDimm-M23-ARM64.apk | grep -q 'lib/arm64-v8a/libskyline.so'
          unzip -l release-assets/SkylineDimm-M23-ARM64.aab | grep -q 'base/lib/arm64-v8a/libskyline.so'

      - name: Publish native emulator release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Skyline Dimm v0.1.${{ github.run_number }} - Native M23 build
          body: |
            Native Android release built from the pinned Skyline source.

            - Package: com.dimm.skyline
            - Version: 0.1.57-video (versionCode 71)
            - ABI: arm64-v8a
            - Native core: libskyline.so
            - Video path: Host1x NVDEC + VIC with FFmpeg H.264, VP8 and VP9.
            - APK signature and native library presence verified in CI.

            Source and licenses:
            - Skyline base: https://github.com/im030/skyline-emu/tree/35fb874a42cb548cbd3d66a00d65e4b2a4c1516b
            - Video implementation: https://github.com/LukeValen/Strato-Mali-Public-Build/tree/9249ea351ad7bd7b0e7d4a319e1ad1c56dae865c
            - Dimm integration and build scripts: https://github.com/dimmstz/Skyline_Edge_Dimm/tree/${{ github.sha }}
            - GPL-3.0-or-later, MPL-2.0 and FFmpeg LGPL-2.1-or-later notices are included in the source repository.

            H.264 and VP8 decode plus VIC composition are regression-tested in CI; VP9 support is included but not separately fixture-tested. Resident Evil 4
            prerecorded campaign videos and Galaxy M23 playback still require on-device testing.
          files: |
            release-assets/SkylineDimm-M23-ARM64.apk
            release-assets/SkylineDimm-M23-ARM64.aab
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

# Automatic publishing policy:
# - Every successful push to main gets a unique v0.1.<run_number> tag and Release.
# - The Android APK/AAB are published by the build job.
# - If the optional native reference build runs, its APK is attached to that same Release.
# - Tag-triggered runs are skipped to prevent recursive duplicate builds/releases.
# - Prefix build-reference-core: on main to request the optional native build.
