name: GitHub Actions cleanup

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: github-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep at most 20 recent workflow runs per branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Remove workflow runs beyond the 20 most recent in each branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const KEEP_PER_BRANCH = 20;

            // Paginate the complete repository history. head_branch is used
            // as the grouping key, so branches created in the future are
            // included automatically without maintaining an allow-list.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const byBranch = new Map();
            for (const run of runs) {
              const branch = run.head_branch || (run.head_sha ? `detached:${run.head_sha}` : 'unknown');
              if (!byBranch.has(branch)) byBranch.set(branch, []);
              byBranch.get(branch).push(run);
            }

            const obsolete = [];
            for (const [branch, branchRuns] of byBranch.entries()) {
              branchRuns.sort(
                (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)
              );

              // Keep the 20 newest runs of this branch, regardless of status.
              // Older active runs are also preserved below because GitHub does
              // not allow deleting in-progress runs.
              const keepIds = new Set(
                branchRuns.slice(0, KEEP_PER_BRANCH).map(run => run.id)
              );
              const branchObsolete = branchRuns.filter(
                run => !keepIds.has(run.id) && run.status === 'completed'
              );

              obsolete.push(...branchObsolete);
              core.info(
                `Branch "${branch}": ${branchRuns.length} runs; keeping newest ${Math.min(KEEP_PER_BRANCH, branchRuns.length)}; ${branchObsolete.length} completed runs eligible for deletion.`
              );
            }

            obsolete.sort(
              (a, b) => Date.parse(a.created_at) - Date.parse(b.created_at)
            );

            let deleted = 0;
            let failed = 0;
            for (const run of obsolete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(
                  `Deleted run #${run.run_number} [${run.head_branch || 'unknown'}] (${run.id}) — ${run.name}`
                );
              } catch (error) {
                failed++;
                core.warning(
                  `Could not delete run #${run.run_number} [${run.head_branch || 'unknown'}] (${run.id}): ${error.message}`
                );
              }
            }

            const activeOutsideWindow = [...byBranch.entries()].reduce(
              (total, [branch, branchRuns]) => {
                const ordered = [...branchRuns].sort(
                  (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)
                );
                const keepIds = new Set(
                  ordered.slice(0, KEEP_PER_BRANCH).map(run => run.id)
                );
                return total + ordered.filter(
                  run => !keepIds.has(run.id) && run.status !== 'completed'
                ).length;
              },
              0
            );

            core.info(
              `Cleanup complete: ${deleted} deleted, ${failed} failed, ${activeOutsideWindow} older active runs preserved across ${byBranch.size} branches.`
            );
            if (failed > 0) {
              core.setFailed(`${failed} workflow run(s) could not be deleted.`);
            }
