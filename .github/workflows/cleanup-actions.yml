name: GitHub Actions cleanup

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: github-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep the 20 most recent completed workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete completed runs older than the 20 most recent
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            // Keep active runs untouched. Retain the 20 newest completed runs
            // across every workflow in this repository.
            const completed = runs
              .filter(run => run.status === 'completed')
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            const obsolete = completed.slice(20);
            core.info('Found ' + runs.length + ' runs; retaining ' + Math.min(20, completed.length) + ' completed runs and deleting ' + obsolete.length + ' older completed runs.');

            let deleted = 0;
            for (const run of obsolete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted++;
                core.info('Deleted run #' + run.run_number + ' (' + run.id + ') from ' + run.name);
              } catch (error) {
                core.warning('Could not delete run #' + run.run_number + ' (' + run.id + '): ' + error.message);
              }
            }

            core.info('Cleanup finished: ' + deleted + '/' + obsolete.length + ' old completed runs deleted.');
