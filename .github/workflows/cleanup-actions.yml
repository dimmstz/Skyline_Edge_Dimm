name: GitHub Actions cleanup

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: github-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep at most 20 recent workflow runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Remove workflow runs beyond the 20 most recent
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch every page, not just the first 100 workflow runs.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            // The newest 20 runs are retained. Never delete a queued,
            // waiting, or in-progress run, even if it is older than the cutoff.
            const ordered = runs.sort(
              (a, b) => Date.parse(b.created_at) - Date.parse(a.created_at)
            );
            const keepIds = new Set(ordered.slice(0, 20).map(run => run.id));
            const obsolete = ordered.filter(
              run => !keepIds.has(run.id) && run.status === 'completed'
            );

            core.info(`Found ${runs.length} runs. Keeping the 20 newest; ${obsolete.length} older completed runs are eligible for deletion.`);

            let deleted = 0;
            let failed = 0;
            for (const run of obsolete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
                deleted++;
                core.info(`Deleted run #${run.run_number} (${run.id}) — ${run.name}`);
              } catch (error) {
                failed++;
                core.warning(`Could not delete run #${run.run_number} (${run.id}): ${error.message}`);
              }
            }

            const activeOutsideWindow = ordered.filter(
              run => !keepIds.has(run.id) && run.status !== 'completed'
            ).length;

            core.info(`Cleanup complete: ${deleted} deleted, ${failed} failed, ${activeOutsideWindow} older active runs preserved.`);
            if (failed > 0) {
              core.setFailed(`${failed} workflow run(s) could not be deleted.`);
            }
