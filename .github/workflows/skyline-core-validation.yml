name: Skyline Core Integration Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "vendor/skyline-upstream"
      - ".github/workflows/skyline-core-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyline-core-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pinned-core:
    name: Build pinned upstream Skyline Release
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Checkout Dimm integration branch
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize pinned Skyline source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth=1 vendor/skyline-upstream
          cd vendor/skyline-upstream

          # Two historical repositories were deleted; mirrors retain the pinned gitlink revisions.
          git config -f .gitmodules submodule.Sirit.url https://github.com/yuzu-mirror/sirit
          git config -f .gitmodules 'submodule.Shader Compiler.url' https://github.com/strato-emu/shader-compiler
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

          test -f app/build.gradle
          test -f app/CMakeLists.txt
          test -f app/src/main/cpp/emu_jni.cpp
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on the runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.0.8775105" \
            "cmake;3.22.1"

      - name: Build complete Skyline native Release
        working-directory: vendor/skyline-upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleFullRelease

      - name: Verify APK and native core
        working-directory: vendor/skyline-upstream
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "$APK" > "$RUNNER_TEMP/skyline-apk-metadata.txt"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libskyline.so'
          if unzip -l "$APK" | grep -q 'libVkLayer_khronos_validation.so'; then
            echo "Release APK unexpectedly contains Vulkan validation layers."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/integration-dist"
          cp "$APK" "$GITHUB_WORKSPACE/integration-dist/Skyline-Core-Integration-Release.apk"
          cp "$RUNNER_TEMP/skyline-apk-metadata.txt" "$GITHUB_WORKSPACE/integration-dist/APK-METADATA.txt"
          sha256sum "$GITHUB_WORKSPACE/integration-dist/Skyline-Core-Integration-Release.apk" > "$GITHUB_WORKSPACE/integration-dist/SHA256SUMS.txt"

      - name: Upload validated upstream build
        uses: actions/upload-artifact@v4
        with:
          name: Skyline-Core-Integration-Release
          path: integration-dist/
          if-no-files-found: error
          retention-days: 14
