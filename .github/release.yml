changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: "Features"
      labels:
        - feature
        - enhancement
    - title: "Bug fixes"
      labels:
        - bug
        - fix
    - title: "Maintenance"
      labels:
        - maintenance
        - documentation
    - title: "Other changes"
      labels:
        - "*"
